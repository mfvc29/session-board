<div class="glass-toolbar">
  <div class="tools-group">
    <button class="tool-btn" [class.active]="currentMode === 'pointer'" title="Interactuar" (click)="setMode('pointer')">
      <lucide-angular [img]="MousePointer2" size="20" strokeWidth="2"></lucide-angular>
    </button>
    <button class="tool-btn" [class.active]="currentMode === 'draw' && currentColor() !== '#1e1e24'" title="Lápiz" (click)="setMode('draw'); selectColor('#ffffff')">
      <lucide-angular [img]="PenTool" size="20" strokeWidth="2"></lucide-angular>
    </button>
    <button class="tool-btn" [class.active]="currentMode === 'draw' && currentColor() === '#1e1e24'" title="Borrador" (click)="setMode('draw'); selectColor('#1e1e24')">
      <!-- We use the background color as an eraser for simplicity in MVP -->
      <lucide-angular [img]="Eraser" size="20" strokeWidth="2"></lucide-angular>
    </button>
  </div>
  
  <div class="divider"></div>
  
  <div class="colors-group">
    @for (color of colors; track color) {
      <button 
        class="color-btn" 
        [class.active]="currentColor() === color"
        [style.background-color]="color"
        (click)="selectColor(color)">
      </button>
    }
  </div>
  
  <div class="divider"></div>
  
  <div class="tools-group">
    <button class="tool-btn" title="Limpiar Pizarra" (click)="onClear()">
      <lucide-angular [img]="Trash2" size="20" strokeWidth="2"></lucide-angular>
    </button>
    <!-- Subir HTML -->
    <label class="tool-btn" title="Cargar HTML" style="cursor: pointer;">
      <lucide-angular [img]="FileCode2" size="20" strokeWidth="2"></lucide-angular>
      <input type="file" style="display: none" accept=".html" (change)="onHtmlSelected($event)" />
    </label>

    <!-- Subir Imagen -->
    <label class="tool-btn" title="Añadir Imagen" style="cursor: pointer;">
      <lucide-angular [img]="Image" size="20" strokeWidth="2"></lucide-angular>
      <input type="file" style="display: none" accept="image/*" (change)="onImageSelected($event)" />
    </label>

    <div class="divider"></div>

    <button class="tool-btn" title="Finalizar Sesión" (click)="endSession.emit()">
      <lucide-angular [img]="Power" size="20" strokeWidth="2" class="danger-icon"></lucide-angular>
    </button>
  </div>
</div>
