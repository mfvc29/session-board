<div class="home-container">
  <div class="main-card">
    <div class="logo">
      <h1>Virtual Board</h1>
    </div>
    <p class="subtitle">La pizarra interactiva para tus clases particulares.</p>
    
    <div class="actions-wrapper">
      <div class="action-section">
        <h3>Profesor</h3>
        @if (!user()) {
          <div class="login-prompt">
            <p style="font-size: 0.9rem; margin-bottom: 1rem; color: #555;">Inicia sesión con Google para crear una clase.</p>
            <button class="secondary-btn" (click)="loginGoogle()">Iniciar Sesión</button>
          </div>
        } @else {
          <div class="user-info" style="font-size: 0.9rem; margin-bottom: 1rem; color: #333;">
            {{ user().displayName }} <a style="color: #666; text-decoration: underline; cursor: pointer; margin-left: 10px;" (click)="logout()">Salir</a>
          </div>
          <div class="input-group">
            <input 
              type="text" 
              placeholder="Código (6 dígitos)" 
              maxlength="6"
              [ngModel]="createCode()"
              (ngModelChange)="createCode.set($event)"
              (keyup.enter)="createSession()"
            >
          </div>
          <button class="primary-btn" style="width: 100%; margin-top: 1rem;" (click)="createSession()">
            Crear Sesión
          </button>
        }
      </div>

      <div class="divider"></div>

      <div class="action-section">
        <h3>Alumno</h3>
        <p style="font-size: 0.9rem; margin-bottom: 1rem; color: #555;">Únete a una clase existente.</p>
        <div class="input-group" style="margin-top: auto;">
          <input 
            type="text" 
            placeholder="Código (6 dígitos)" 
            maxlength="6"
            [ngModel]="joinCode()"
            (ngModelChange)="joinCode.set($event)"
            (keyup.enter)="joinSession()"
          >
          <button class="secondary-btn" (click)="joinSession()" style="margin-top: 1rem;">Unirse</button>
        </div>
      </div>
    </div>
  </div>
</div>
