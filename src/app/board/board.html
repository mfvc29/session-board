<div class="board-container">
  <!-- Session Info Overlay -->
  <div class="session-info glass-panel">
    <div class="role-badge" [class.teacher]="role() === 'teacher'">{{ role() === 'teacher' ? 'Profesor' : 'Alumno' }}</div>
    <div class="session-code">Código: <strong>{{ sessionId() }}</strong></div>
  </div>

  <div class="content-layer">
    @if (iframeSrc()) {
      <iframe [src]="iframeSrc()" frameborder="0" width="100%" height="100%"></iframe>
    } @else if (images().length === 0) {
      <div class="empty-state">
        <h2>Área de Trabajo</h2>
        <p>Sube un archivo HTML o una imagen para comenzar el ejercicio...</p>
      </div>
    }

    <!-- Render Extra Images -->
    <div class="extra-images-container">
      @for (img of images(); track $index) {
        <img [src]="img" class="extra-image" />
      }
    </div>
  </div>
  <svg class="canvas-layer"
       (pointerdown)="handlePointerDown($event)"
       (pointermove)="handlePointerMove($event)"
       (pointerup)="handlePointerUp($event)"
       (pointercancel)="handlePointerUp($event)"
       [style.touch-action]="'none'"
       [style.pointer-events]="currentMode() === 'draw' ? 'auto' : 'none'">
    
    <!-- Render all other strokes -->
    @for (stroke of allStrokes(); track stroke.id) {
      <path [attr.d]="stroke.path" [attr.fill]="stroke.color"></path>
    }
    
    <!-- Render current stroke -->
    @if (currentPath()) {
      <path [attr.d]="currentPath()" [attr.fill]="currentColor()"></path>
    }
  </svg>
  
  <app-toolbar 
    [currentColor]="currentColor()"
    [role]="role()"
    (colorChange)="changeColor($event)"
    (clear)="clearBoard()"
    (uploadHtml)="handleHtmlUpload($event)"
    (uploadImage)="handleImageUpload($event)"
    (endSession)="handleEndSession()"
    (toggleMode)="handleModeToggle($event)">
  </app-toolbar>
</div>
